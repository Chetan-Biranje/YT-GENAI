services:
  - type: web
    name: yt-genai
    runtime: node
    buildCommand: npm ci --prefix Backend && npm ci --prefix Frontend && npm run build --prefix Frontend
    startCommand: npm start --prefix Backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.13.0
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
